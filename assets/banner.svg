<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mohammed Hany - Computer Science and Artificial Intelligence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#051F20"/>
      <stop offset="50%" stop-color="#0B2B26"/>
      <stop offset="100%" stop-color="#235347"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#8EB69B" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#8EB69B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#8EB69B"/>
      <stop offset="100%" stop-color="#DAF1DE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="220%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="round"><rect width="1200" height="340" rx="26"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .float { animation: float 6s ease-in-out infinite; }
      .rise  { opacity: 0; animation: rise 1.1s ease-out forwards; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes rise  { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: translateX(0); } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>
    <circle cx="90" cy="-20" r="170" fill="#163832" opacity="0.45"/>
    <circle cx="520" cy="380" r="150" fill="#235347" opacity="0.25"/>

    <!-- Left: identity -->
    <g class="rise" style="animation-delay:.1s">
      <text x="70" y="140" font-size="68" font-weight="700" fill="#DAF1DE" letter-spacing="-1">Mohammed Hany</text>
    </g>
    <g class="rise" style="animation-delay:.3s">
      <rect x="72" y="164" width="96" height="5" rx="2.5" fill="url(#accent)"/>
    </g>
    <g class="rise" style="animation-delay:.5s">
      <text x="70" y="216" font-size="26" font-weight="500" fill="#DAF1DE">Computer Science  ·  Artificial Intelligence</text>
    </g>
    <g class="rise" style="animation-delay:.7s">
      <text x="70" y="254" font-size="19" fill="#8EB69B">King Salman International University (KSIU)</text>
    </g>

    <!-- Right: palette capsules -->
    <g filter="url(#shadow)">
      <g class="float" style="animation-delay:0s">
        <rect x="810" y="26" width="330" height="84" rx="42" fill="#051F20" stroke="#8EB69B" stroke-opacity="0.18"/>
        <text x="856" y="56" font-size="14" fill="#DAF1DE" fill-opacity="0.75">#051F20</text>
      </g>
      <g class="float" style="animation-delay:.4s">
        <rect x="810" y="66" width="330" height="84" rx="42" fill="#0B2B26" stroke="#8EB69B" stroke-opacity="0.15"/>
        <text x="856" y="96" font-size="14" fill="#DAF1DE" fill-opacity="0.75">#0B2B26</text>
      </g>
      <g class="float" style="animation-delay:.8s">
        <rect x="810" y="106" width="330" height="84" rx="42" fill="#163832"/>
        <text x="856" y="136" font-size="14" fill="#DAF1DE" fill-opacity="0.75">#163832</text>
      </g>
      <g class="float" style="animation-delay:1.2s">
        <rect x="810" y="146" width="330" height="84" rx="42" fill="#235347"/>
        <text x="856" y="176" font-size="14" fill="#DAF1DE" fill-opacity="0.8">#235347</text>
      </g>
      <g class="float" style="animation-delay:1.6s">
        <rect x="810" y="186" width="330" height="84" rx="42" fill="#8EB69B"/>
        <text x="856" y="216" font-size="14" fill="#051F20" fill-opacity="0.8">#8EB69B</text>
      </g>
      <g class="float" style="animation-delay:2s">
        <rect x="810" y="226" width="330" height="84" rx="42" fill="#DAF1DE"/>
        <text x="856" y="256" font-size="14" fill="#051F20" fill-opacity="0.8">#DAF1DE</text>
      </g>
    </g>
  </g>
</svg>
