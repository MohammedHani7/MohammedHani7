<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mohammed Hany - Computer Science and Artificial Intelligence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#051F20"/>
      <stop offset="40%" stop-color="#0B2B26"/>
      <stop offset="75%" stop-color="#163832"/>
      <stop offset="100%" stop-color="#235347"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#8EB69B" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#8EB69B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#8EB69B"/>
      <stop offset="100%" stop-color="#DAF1DE"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8EB69B"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmask"><rect width="1200" height="300" fill="url(#fade)"/></mask>
    <clipPath id="round"><rect width="1200" height="300" rx="26"/></clipPath>
    <style>
      .name { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Fira Code', 'SF Mono', Consolas, 'Courier New', monospace; }
      .rise { opacity: 0; animation: rise 1s ease-out forwards; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes rise  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)" opacity="0.16" mask="url(#dotmask)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
  </g>

  <g class="rise" style="animation-delay:.1s">
    <text class="name" x="600" y="132" text-anchor="middle" font-size="74" font-weight="700" fill="#DAF1DE" letter-spacing="-1.5">Mohammed Hany</text>
  </g>
  <g class="rise" style="animation-delay:.35s">
    <rect x="552" y="158" width="96" height="5" rx="2.5" fill="url(#accent)"/>
  </g>
  <g class="rise" style="animation-delay:.6s">
    <text class="mono" x="600" y="206" text-anchor="middle" font-size="23" fill="#8EB69B">&gt; Computer Science  ·  Artificial Intelligence<tspan class="cursor" fill="#DAF1DE">_</tspan></text>
  </g>
  <g class="rise" style="animation-delay:.85s">
    <text class="mono" x="600" y="252" text-anchor="middle" font-size="19" font-weight="600" fill="#DAF1DE" fill-opacity="0.85" letter-spacing="7">KSIU</text>
  </g>
</svg>
